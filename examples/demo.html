<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Demo - Leaflet Gradient Symbology</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="../dist/leaflet-gradient-symbology.css" />
    <script type="module" src="../dist/leaflet-gradient-symbology.js"></script>
    <style>
      #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import '../src/L.GradientSymbology.js';

        const map = L.map('map').setView([14, -14], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        fetch('data/reg.geojson')
            .then(res => res.json())
            .then(data => {
                const layer = L.geoJSON(data).addTo(map);

                L.gradientSymbology({
                    map: map,
                    layer: layer,
                    field: 'densite',
                    palette: 'Blues',
                    classes: 6,
                    method: 'quantile',
                    legend: true
                });
            });
    </script>
</body>
</html>
